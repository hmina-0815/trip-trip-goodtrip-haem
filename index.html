<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>우리 여행 동선</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: day timeline panel on the left, a gridded distance map on the right (stacked on phones, map first). */
:root{
  --bg:#f4f5f8; --surface:#ffffff; --ink:#1b1c25; --muted:#6a6e80; --line:#e2e4ec;
  --accent:#5f45e6; --accent-ink:#ffffff; --accent-soft:#ece8fd;
  --map:#eeefe9; --sea:#d4e3ec; --ward:#c9cdc2; --map-grid:#d5ded5; --map-ink:#3d4a42; --pill:#ffffff;
  --danger:#d4433a; --ok:#18936f;
  --f-display:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13141a; --surface:#1c1e26; --ink:#eceef5; --muted:#9a9fb3; --line:#2c2f3b;
  --accent:#9583ff; --accent-ink:#14121f; --accent-soft:#2a2550;
  --map:#1d211f; --sea:#111a21; --ward:#343a36; --map-grid:#25312c; --map-ink:#b9c8be; --pill:#242733;
  --danger:#ff6f64; --ok:#3cc79c; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#13141a; --surface:#1c1e26; --ink:#eceef5; --muted:#9a9fb3; --line:#2c2f3b;
  --accent:#9583ff; --accent-ink:#14121f; --accent-soft:#2a2550;
  --map:#1d211f; --sea:#111a21; --ward:#343a36; --map-grid:#25312c; --map-ink:#b9c8be; --pill:#242733;
  --danger:#ff6f64; --ok:#3cc79c; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);height:100%;}
.app>.panel{grid-column:1;grid-row:1}.app>.mapwrap{grid-column:2;grid-row:1}
[hidden]{display:none!important}
.panel{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface);border-right:1px solid var(--line)}
.panel-scroll{overflow-y:auto;flex:1;min-height:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;padding-block:0 32px}
.mapwrap{position:relative;min-width:0;min-height:0;background:var(--map);overflow:hidden;touch-action:none;color:var(--ink);
  /* the map always stays light, whatever the page theme */
  --map:#fbfbf8; --sea:#e6f1f8; --ward:#dcdfd6; --map-grid:#e6eae4; --map-ink:#4a5550; --pill:#ffffff; --ink:#1b1c25; --line:#e2e4ec; --surface:#ffffff; --accent:#5f45e6; color-scheme:light}
@media (max-width:860px){
  .app{display:block;height:auto}
  .mapwrap{height:46vh;min-height:300px}
  .panel{border-right:0}
  .panel-scroll{overflow:visible;padding-right:max(16px,env(safe-area-inset-right,0px))}
}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-block:20px 12px}
.trip-title{font-family:var(--f-display);font-size:24px;line-height:1.25;margin:0;text-wrap:balance;background:none;border:0;padding:0;text-align:left}
.trip-sub{color:var(--muted);font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.seg{display:flex;gap:4px;padding:4px;background:var(--bg);border-radius:10px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:7px 0;border-radius:7px;font-weight:500;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.banner{font-size:12.5px;padding:8px 12px;border-radius:8px;background:var(--accent-soft);color:var(--ink);margin-bottom:12px}

/* day tabs */
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:thin}
.daychip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;display:flex;align-items:center;gap:6px;font-size:13px}
.daychip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.daychip .d{color:var(--muted);font-variant-numeric:tabular-nums}
.daychip[aria-selected="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.daychip.drop{background:var(--accent-soft)}
.daychip.add{color:var(--accent);border-style:dashed}

.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 0 4px}
.dayhead h2{font-size:18px;margin:0;font-weight:700}
.dayhead h2 span{color:var(--muted);font-weight:500;font-size:15px;margin-left:4px;font-variant-numeric:tabular-nums}
.linkbtn{border:0;background:none;color:var(--muted);padding:4px 2px;font-size:14px}
.linkbtn.on{color:var(--accent);font-weight:600}
.daystat{font-size:12.5px;color:var(--muted);margin-bottom:14px;font-variant-numeric:tabular-nums}
.daystat b{color:var(--ink);font-family:var(--f-mono);font-weight:600}

/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:13px;top:14px;bottom:14px;width:2px;background:var(--line)}
.tl li{position:relative}
.place{display:flex;align-items:center;gap:10px}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;position:relative;z-index:1;box-shadow:0 0 0 3px var(--surface)}
.card{flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;background:var(--surface);text-align:left;display:block;width:100%}
.card:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.place.sel .card{border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.pname{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.pmeta{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.pmemo{font-size:12.5px;margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.cardrow{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.mini{flex:none;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:none}
.mini:hover{color:var(--accent);border-color:var(--accent)}
.place.dragging{opacity:.35}
.grip{flex:none;touch-action:none;cursor:grab;color:var(--muted);font-size:16px;line-height:1;padding:4px 2px;user-select:none;-webkit-user-select:none}
.grip:hover{color:var(--accent)}
.ghost{position:fixed;z-index:70;pointer-events:none;opacity:.92;box-shadow:0 10px 30px rgba(0,0,0,.2);border-radius:var(--r);background:var(--surface);list-style:none;margin:0}
body.dragging-place{user-select:none;-webkit-user-select:none;cursor:grabbing}
.dlabel{font-weight:600}
.place.drop-before .card{box-shadow:0 -3px 0 var(--accent)}
.place.drop-after .card{box-shadow:0 3px 0 var(--accent)}
.del{flex:none;width:26px;height:26px;border-radius:50%;border:0;background:var(--danger);color:#fff;font-weight:700;line-height:1}
.mv{display:flex;flex-direction:column;gap:2px}
.mv button{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:28px;height:22px;font-size:11px;line-height:1;color:var(--muted)}
.mv button:disabled{opacity:.35;cursor:default}
.gap{height:34px;display:flex;align-items:center}
.dist{position:relative;z-index:1;font-family:var(--f-mono);font-size:12px;font-weight:500;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:-8px;font-variant-numeric:tabular-nums}
.dist.far{border-color:var(--danger);color:var(--danger)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted);text-align:center;font-size:13px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.optbox{margin-top:10px;border-radius:10px;background:var(--accent-soft);padding:10px 12px;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dayfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;font-size:13px;flex-wrap:wrap}
.dayfoot a{color:var(--accent);text-decoration:none;font-weight:600}

/* memos */
.memo h2{font-size:18px;margin:6px 0 2px}
.memo .sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.mlist{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px}
.mlist li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.mlist li .t{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.mlist li.done .t{text-decoration:line-through;color:var(--muted)}
.mlist input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.mlist a{color:var(--accent)}
.addform{display:flex;gap:8px}
.addform input{flex:1;min-width:0}
.field{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;width:100%;box-sizing:border-box}
.field:focus{border-color:var(--accent);outline:none}
textarea.field{resize:vertical;min-height:70px}

/* map */
#base{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#map{position:relative;display:block;width:100%;height:100%;cursor:grab;user-select:none}
#map.panning{cursor:grabbing}
.g-line{stroke:var(--map-grid);stroke-width:1}
.m-txt{fill:var(--map-ink);font-family:var(--f-body)}
.m-name{fill:var(--ink);font-size:12px;font-weight:600;paint-order:stroke;stroke:var(--map);stroke-width:4px;stroke-linejoin:round}
.m-pill{fill:var(--pill);stroke:var(--line)}
.m-dist{fill:var(--ink);font-family:var(--f-mono);font-size:11.5px;font-weight:600}
.m-scale{stroke:var(--map-ink);stroke-width:2;fill:none}
.pin{cursor:pointer}
.mapctl{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));top:12px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:17px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.maptop{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:12px;right:64px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.maptop label,.maptop a{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;box-shadow:0 1px 3px rgba(0,0,0,.08);color:var(--ink);text-decoration:none}
.maptop a{color:var(--accent);font-weight:600}
.mapempty{position:absolute;inset:0;display:grid;place-items:center;color:var(--map-ink);font-size:14px;text-align:center;padding:24px;pointer-events:none}
.legend{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));bottom:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:70%}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--surface);border-radius:999px;padding:3px 9px;border:1px solid var(--line)}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--c)}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,10,20,.42);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.sheet{background:var(--surface);border-radius:16px;width:min(520px,100%);max-height:calc(100% - 32px);overflow-y:auto;padding:20px;box-sizing:border-box;box-shadow:0 20px 50px rgba(0,0,0,.25)}
@media (max-width:600px){.overlay{align-items:flex-end;padding:0}.sheet{border-radius:16px 16px 0 0;max-height:88%;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}}
.sheet h3{margin:0 0 12px;font-size:18px}
.sheet .row{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.sheet label.l{font-size:12.5px;color:var(--muted);font-weight:500}
.sheet .hint{font-size:12px;color:var(--muted);line-height:1.5}
.sheet .err{font-size:12.5px;color:var(--danger)}
.sheet .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.results{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.results li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.results li .t{flex:1;min-width:0}
.results a{font-size:12px;color:var(--muted)}
.conf{font-size:11px;border-radius:4px;padding:0 5px;margin-left:4px;background:var(--bg);color:var(--muted)}
.wtools{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.wtools .seg{margin:0;flex:none}
.wtools .seg button{padding:5px 12px;flex:none}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cat{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px}
.cat i,.wdot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.cat[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.cat b{font-family:var(--f-mono);font-weight:600;font-size:11.5px;color:var(--muted)}
.wgroup{margin-bottom:16px}
.wgroup h3{display:flex;align-items:baseline;gap:8px;font-size:15px;margin:0 0 6px}
.wgroup h3 span{color:var(--muted);font-weight:500;font-size:12.5px}
.wgroup h3 button{margin-left:auto}
.wgroup .mlist{margin:0;gap:4px}
.wgroup .mlist li{padding:7px 10px;border-left:3px solid var(--c)}
.wtag{font-size:12px;color:var(--muted);flex:none}
.waddr{display:block;font-size:11.5px;color:var(--muted);white-space:normal;text-decoration:none}
.wform{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wform #wishIn{grid-column:1/-1}
.wform .btn{grid-column:1/-1}
.near{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-6px 0 14px;font-size:12.5px;color:var(--muted)}
.near button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 9px;font-size:12px}
.near button:hover{border-color:var(--accent);color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:13px;z-index:60;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline}

.attrib{position:absolute;left:8px;bottom:6px;z-index:3;font-size:10px;color:#5b6170;background:rgba(255,255,255,.75);padding:1px 6px;border-radius:4px}
.attrib a{color:inherit}
/* page view: the whole trip as one long, readable page */
.pagebtn{border-color:var(--accent);color:var(--accent);font-weight:600}
.pv{min-height:100%;background:var(--bg)}
.pvbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.pvbar-in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pvnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.pvnav::-webkit-scrollbar{display:none}
.pvnav button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.pvnav button i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c,var(--muted));margin-right:5px;vertical-align:1px}
.pvnav button:hover{color:var(--ink);border-color:var(--c,var(--accent))}
.pvbody{max-width:960px;margin:0 auto;padding-block:8px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:40px}
.pv section{scroll-margin-top:64px}
.pvcover{padding-top:28px}
.pveyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:600}
.pvcover h1{font-family:var(--f-display);font-size:clamp(30px,6vw,46px);line-height:1.15;margin:8px 0 10px;text-wrap:balance}
.pvfacts{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:13.5px}
.pvfacts b{color:var(--ink);font-weight:600}
.pvmap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);height:360px;
  --map:#fbfbf8; --sea:#e6f1f8; --ward:#dcdfd6; --map-grid:#e6eae4; --map-ink:#4a5550; --pill:#ffffff; --ink:#1b1c25; --line:#e2e4ec; --surface:#ffffff; --accent:#5f45e6; background:var(--map); color-scheme:light}
.pvmap canvas{position:absolute;inset:0;width:100%;height:100%}
.pvmap svg{position:relative;display:block;width:100%;height:100%}
.pvlegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px;color:var(--muted)}
.pvlegend span{display:inline-flex;align-items:center;gap:6px}
.pvlegend i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.pvlegend b{color:var(--ink);font-weight:600}
.pvh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 14px;border-bottom:2px solid var(--c,var(--ink));padding-bottom:10px}
.pvh .no{font-family:var(--f-mono);font-weight:600;font-size:13px;letter-spacing:.12em;color:var(--c,var(--muted))}
.pvh h2{font-family:var(--f-display);font-size:26px;line-height:1.2;margin:0;text-wrap:balance}
.pvh .when{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.pvday{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.pvday .pvmap{position:sticky;top:64px;height:420px}
.pvstat{font-size:13px;color:var(--muted);margin-bottom:10px}
.pvstat b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.pvlist{list-style:none;margin:0;padding:0}
.pvlist .pl{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start}
.pvlist .n{width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;margin-top:2px}
.pvlist .nm{font-weight:600;font-size:15.5px;line-height:1.35}
.pvlist .mt{color:var(--muted);font-size:12.5px;margin-top:2px}
.pvlist .mm{font-size:13px;margin-top:6px;padding:7px 10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.pvlist .gl{font-size:12px;color:var(--accent);text-decoration:none;font-weight:500}
.pvlist .gl:hover{text-decoration:underline}
.pvlist .gap{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;min-height:30px}
.pvlist .gap::before{content:"";justify-self:center;width:0;border-left:2px dashed color-mix(in srgb,var(--c) 55%,transparent);margin-block:4px}

let drag = null;
const clearMarks = () => document.querySelectorAll('.drop-before,.drop-after,.drop').forEach(n => n.classList.remove('drop-before', 'drop-after', 'drop'));

  const g = e.target.closest('[data-grip]'); if (!g || readOnly) return;

  e.preventDefault();
  const r = li.getBoundingClientRect(), ghost = document.createElement('ul');
  ghost.className = 'tl ghost'; ghost.appendChild(li.cloneNode(true));
  Object.assign(ghost.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', padding: '0' });
  document.body.appendChild(ghost); li.classList.add('dragging'); document.body.classList.add('dragging-place');

  const v = y < top + 70 ? -Math.ceil((top + 70 - y) / 6) : y > bot - 70 ? Math.ceil((y - bot + 70) / 6) : 0;

  const el = document.elementFromPoint(e.clientX, e.clientY); if (!el) return;
  const li = el.closest('.place[data-pid]'), chip = el.closest('.daychip[data-day]');
  if (li && li.dataset.pid !== drag.id) { const r = li.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2; li.classList.add(after ? 'drop-after' : 'drop-before'); drag.target = { pid: li.dataset.pid, after }; }

        p.name = $('#pName').value.trim() || p.name; p.cat = $('#pCat').value.trim(); p.addr = $('#pAddr').value.trim(); p.memo = $('#pMemo').value;
        const shop = placeShop(p);
        if (shop && (loc || (p.addr && p.addr !== shop.addr))) syncShop(shop, p, !!loc);
        const toDay = $('#pDay').value;
        if (toDay !== f.d.id) movePlace(pid, toDay, null); else saveDay(f.d);
        close(); render();
      };
    });
}

// standalone web build only: look up a readable address for coordinates (OpenStreetMap)
const GEO = typeof WEB !== 'undefined' && WEB;
async function revAddr(c) {
  try {
    const r = await (await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=ko,ja&lat=' + c.lat + '&lon=' + c.lng)).json();
    const parts = String(r && r.display_name || '').split(',').map(x => x.trim()).filter(x => x && x !== '일본' && x !== '日本' && !/^\d{3}-?\d{4}$/.test(x));
    return parts.reverse().join(' ');
  } catch (e) { return ''; }
}
function autoAddr(locSel, addrSel, hintSel) {
  if (!GEO || !$(locSel)) return;
  let t = 0, last = '';
  $(locSel).addEventListener('input', () => { clearTimeout(t); t = setTimeout(async () => {
    const c = parseCoords($(locSel).value); if (!c) return;
    const k = c.lat + ',' + c.lng; if (k === last) return; last = k;
    if (hintSel && $(hintSel)) $(hintSel).textContent = '주소 찾는 중…';
    const a = await revAddr(c);
    if (a && $(addrSel)) $(addrSel).value = a;
    if (hintSel && $(hintSel)) $(hintSel).textContent = '';
  }, 350); });
}

let searchCtl = null;
function openSearch(prefill) {
  const day = curDay(); if (!day) return;
  const aiOk = true, stay = state.meta.stay, hasShops = state.wish.length > 0 || !!stay, first = prefill ? (aiOk ? 'ai' : 'manual') : hasShops ? 'shop' : aiOk ? 'ai' : 'manual';
  sheet('<h3>장소 추가</h3>' +
    '<div class="seg" role="tablist" id="sTabs">' + (hasShops ? '<button data-st="shop" aria-selected="' + (first === 'shop') + '">샵리스트</button>' : '') + '<button data-st="ai" aria-selected="' + (first === 'ai') + '"' + (aiOk ? '' : ' disabled') + '>검색</button><button data-st="manual" aria-selected="' + (first === 'manual') + '">링크·좌표</button></div>' +
    '<div class="row"><label class="l" for="aDay">추가할 day</label><select class="field" id="aDay">' + dayOptions(day.id) + '</select></div>' +
    '<div id="stShop"' + (first === 'shop' ? '' : ' hidden') + '><input class="field" id="shopQ" placeholder="가게 이름이나 지역으로 거르기" maxlength="40"><ul class="results" id="shopRes"></ul></div>' +
    '<div id="stAi"' + (first === 'ai' ? '' : ' hidden') + '>' +
      '<form class="addform" id="qForm"><input class="field" id="q" placeholder="예: Ueno Ameyoko, 浅草寺, Shibuya Parco" value="' + esc(prefill || '') + '" maxlength="120"><button class="btn primary" id="qBtn">찾기</button></form>' +
      '<p class="hint" style="margin-top:8px">OpenStreetMap에서 찾아요. 가게 이름은 영어나 일본어로 찾으면 더 잘 나와요. 못 찾으면 ‘링크·좌표’ 탭에 Google 지도 링크를 붙여 넣으세요.</p>' +
      '<ul class="results" id="res"></ul></div>' +
    '<div id="stManual"' + (first === 'manual' ? '' : ' hidden') + '>' +
      '<div class="row"><label class="l" for="mLoc">Google 지도 링크 또는 좌표</label><input class="field" id="mLoc" placeholder="https://www.google.com/maps/place/… 또는 35.83801, 129.20951"><span class="hint">Google 지도에서 장소를 우클릭(모바일은 길게 누르기)하면 좌표를 복사할 수 있어요. 장소 페이지의 긴 주소를 붙여넣어도 돼요.</span></div>' +
      '<div class="row"><label class="l" for="mName">이름</label><input class="field" id="mName" maxlength="120" placeholder="예: 황리단길" value="' + esc(prefill || '') + '"></div>' +
      '<div class="row"><label class="l" for="mCat">분류 · 주소 (선택)</label><div style="display:flex;gap:8px"><input class="field" id="mCat" style="width:34%" maxlength="30" placeholder="관광명소"><input class="field" id="mAddr" maxlength="200" placeholder="주소"></div></div>' +
      '<span class="err" id="mErr"></span>' +
      '<div class="btns"><button class="btn primary" id="mAdd">추가</button></div></div>' +
    '<div class="btns"><button class="btn" data-close>닫기</button></div>', close => {
      $('#sTabs').onclick = e => { const b = e.target.closest('[data-st]'); if (!b || b.disabled) return;
        document.querySelectorAll('#sTabs button').forEach(x => x.setAttribute('aria-selected', x === b));
        $('#stShop').hidden = b.dataset.st !== 'shop'; $('#stAi').hidden = b.dataset.st !== 'ai'; $('#stManual').hidden = b.dataset.st !== 'manual'; };
      $('#mLoc').addEventListener('input', () => { const n = nameFromUrl($('#mLoc').value); if (n && !$('#mName').value.trim()) $('#mName').value = n; });
      autoAddr('#mLoc', '#mAddr', '#mErr');
      const addTo = p => {
        const d = state.days.find(x => x.id === $('#aDay').value) || day;
        d.places.push(p); saveDay(d); ui.day = d.id; ui.sel = p.id; render();
      };
      const shopWhere = it => { const out = []; state.days.forEach((d, i) => { if (d.places.some(p => p.id === 's' + it.id || p.id.startsWith('s' + it.id + '_'))) out.push('day ' + (i + 1)); }); return out; };
      const renderShops = () => {
        const q = $('#shopQ').value.trim().toLowerCase(), groups = new Map();
        state.wish.filter(it => !q || (it.text + ' ' + (it.area || '')).toLowerCase().includes(q)).forEach(it => { const a = (it.area || '').trim() || '지역 미정'; if (!groups.has(a)) groups.set(a, []); groups.get(a).push(it); });
        let h = '';
        if (stay && (!q || ('숙소 ' + stay.name).toLowerCase().includes(q))) {
          const at = []; state.days.forEach((d, i) => { if (d.places.some(p => hav(p, stay) < 80)) at.push('day ' + (i + 1)); });
          h += '<li style="border:0;padding:8px 2px 0;font-weight:700">숙소</li><li style="--c:#0f766e"><span class="wdot"></span><div class="t"><div class="pname" style="font-size:14px">' + esc(stay.name) + '</div><div class="pmeta">숙소' + (at.length ? ' · <b style="color:var(--accent)">' + at.join(', ') + '에 있음</b>' : '') + '</div></div>' +
            '<button class="btn' + (at.length ? '' : ' primary') + '" data-stayadd>' + (at.length ? '또 추가' : '추가') + '</button></li>';
        }
        for (const [a, arr] of groups) {
          h += '<li style="border:0;padding:8px 2px 0;font-weight:700">' + esc(a) + '</li>';
          h += arr.map(it => { const c = wcat(it.cat), at = shopWhere(it), loc = isFinite(it.lat) || areaCoord(it.area);
            return '<li style="--c:' + c[2] + '"><span class="wdot"></span><div class="t"><div class="pname" style="font-size:14px">' + esc(it.text) + '</div><div class="pmeta">' + esc(c[1]) + (at.length ? ' · <b style="color:var(--accent)">' + at.join(', ') + '에 있음</b>' : '') + (loc ? '' : ' · 위치 없음') + '</div></div>' +
              '<button class="btn' + (at.length ? '' : ' primary') + '" data-shopadd="' + esc(it.id) + '"' + (loc ? '' : ' disabled title="위치가 없어서 검색으로 추가해 주세요"') + '>' + (at.length ? '또 추가' : '추가') + '</button></li>'; }).join('');
        }
        $('#shopRes').innerHTML = h || '<li class="hint" style="border:0">맞는 가게가 없어요</li>';
      };
      if (hasShops) {
        renderShops();
        $('#shopQ').addEventListener('input', renderShops);
        $('#shopRes').onclick = ev => {
          if (ev.target.closest('[data-stayadd]')) { addTo({ id: uid(), name: stay.name, cat: '숙소', addr: stay.addr || '', memo: '', lat: stay.lat, lng: stay.lng, approx: !!stay.approx }); toast('숙소를 추가했어요'); renderShops(); return; }
          const b = ev.target.closest('[data-shopadd]'); if (!b || b.disabled) return;
          const it = state.wish.find(x => x.id === b.dataset.shopadd); if (!it) return;
          let lat = it.lat, lng = it.lng, approx = !!it.approx;
          if (!isFinite(lat)) { const c = areaCoord(it.area); if (!c) return; lat = c.lat; lng = c.lng; approx = true; }
          const id = shopWhere(it).length || findPlace('s' + it.id) ? 's' + it.id + '_' + uid() : 's' + it.id;
          addTo({ id, name: it.text, cat: wcat(it.cat)[1], addr: it.addr || it.area || '', memo: '', lat, lng, approx });
          toast('‘' + it.text + '’을(를) 추가했어요'); renderShops();
        };
      }
      $('#mAdd').onclick = () => {
        const loc = $('#mLoc').value.trim(), c = parseCoords(loc), name = $('#mName').value.trim() || nameFromUrl(loc);
        if (!c) { $('#mErr').textContent = isShortLink(loc) ? '짧은 링크(maps.app.goo.gl)는 읽을 수 없어요. 브라우저에서 연 뒤 주소창의 긴 주소나 좌표를 붙여넣어 주세요.' : '위치를 찾지 못했어요. Google 지도 링크나 “35.83801, 129.20951” 같은 좌표를 넣어 주세요.'; return; }
        if (!name) { $('#mErr').textContent = '장소 이름을 적어 주세요.'; return; }
        addTo({ id: uid(), name, cat: $('#mCat').value.trim(), addr: $('#mAddr').value.trim(), memo: '', lat: c.lat, lng: c.lng, approx: false });
        toast('‘' + name + '’을(를) 추가했어요'); $('#mLoc').value = ''; $('#mName').value = ''; $('#mCat').value = ''; $('#mAddr').value = ''; $('#mErr').textContent = '';
      };
      if (!aiOk) return;
      $('#qForm').onsubmit = async e => {
        e.preventDefault();
        const q = $('#q').value.trim(); if (!q) return;
        const res = $('#res'), btn = $('#qBtn');
        if (searchCtl) searchCtl.abort(); searchCtl = new AbortController();
        res.innerHTML = '<li class="hint" style="border:0">찾는 중…</li>'; btn.disabled = true;
        try {
          const u = 'https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=0&limit=8&accept-language=ko,ja,en&countrycodes=jp&viewbox=139.4,35.95,140.1,35.45&q=' + encodeURIComponent(q);
          const out = await (await fetch(u, { signal: searchCtl.signal, headers: { 'Accept': 'application/json' } })).json();
          const list = (Array.isArray(out) ? out : []).map(r => ({ name: String(r.name || String(r.display_name || '').split(',')[0]).slice(0, 120), cat: '', addr: String(r.display_name || '').split(',').slice(1, 4).join(',').trim().slice(0, 200), lat: +r.lat, lng: +r.lon, conf: 'high' }))
            .filter(r => r.name && isFinite(r.lat) && isFinite(r.lng));
          if (!list.length) { res.innerHTML = '<li class="hint" style="border:0">찾지 못했어요. 지역 이름을 붙여서 다시 찾거나 ‘링크·좌표로 추가’를 써 주세요.</li>'; return; }
          res.innerHTML = list.map((r, i) => '<li><div class="t"><div class="pname" style="font-size:14px">' + esc(r.name) + (r.conf === 'low' ? '<span class="conf">위치 불확실</span>' : '') + '</div><div class="pmeta">' + esc([r.cat, r.addr].filter(Boolean).join(' · ')) + '</div><a href="' + esc(gSearch({ name: r.name, addr: r.addr })) + '" target="_blank" rel="noopener">Google 지도에서 확인 ↗</a></div><button class="btn primary" data-add="' + i + '">추가</button></li>').join('');
          res.onclick = ev => {
            const b = ev.target.closest('[data-add]'); if (!b || b.disabled) return;
            const r = list[+b.dataset.add];
            addTo({ id: uid(), name: r.name, cat: r.cat, addr: r.addr, memo: '', lat: r.lat, lng: r.lng, approx: false });
            b.textContent = '추가됨'; b.disabled = true; b.classList.remove('primary');
          };
        } catch (err) {
          const c = err && err.code;
          if (c === 'cancelled') return;
          res.innerHTML = '<li class="hint" style="border:0">' + esc(
            c === 'not_granted' || c === 'sampling_disabled' ? '검색을 쓰려면 Claude 사용을 허용해야 해요. 대신 ‘링크·좌표로 추가’를 쓸 수 있어요.' :
            c === 'rate_limited' ? '잠깐 검색이 많았어요. 조금 뒤 다시 찾아 주세요.' :
            c === 'invalid_json' ? '결과를 읽지 못했어요. 다시 찾아 주세요.' : '검색하지 못했어요. 다시 시도하거나 ‘링크·좌표로 추가’를 써 주세요.') + '</li>';
        } finally { btn.disabled = false; }
      };
      if (prefill) $('#qForm').requestSubmit();
    });
}

/* ---------- boot ---------- */
function loadLocal() {
  try { const d = JSON.parse(lsGet('tp-local') || 'null'); if (d) {
    state.meta = { title: String(d.meta && d.meta.title || ''), start: String(d.meta && d.meta.start || ''), stay: cleanStay(d.meta && d.meta.stay) };
    state.days = (d.days || []).map(x => ({ id: String(x.id), order: +x.order || 0, label: String(x.label || '').slice(0, 40), places: (x.places || []).map(cleanPlace).filter(Boolean) }));
    state.check = cleanItems(d.check); state.wish = cleanItems(d.wish); state.buy = cleanItems(d.buy);
  } } catch (e) {}
  loaded = { meta: true, days: true }; render();
}
function onErr(e) { console.warn(e); if (e && (e.code === 'revoked' || e.code === 'permission-denied')) setReadOnly(true); }
function subscribe() {
  db.doc('trip/meta').onSnapshot(s => {
    loaded.meta = true;
    if (!dirty('trip/meta') && s.exists) { const d = s.data(); state.meta = { title: String(d.title || ''), start: String(d.start || ''), stay: cleanStay(d.stay) }; }
    render();
  }, onErr);
  db.collection('days').onSnapshot(snap => {
    loaded.days = true;
    const local = new Map(state.days.map(d => [d.id, d]));
    const next = [];
    for (const x of snap.docs) {
      if (!x.exists || deleted.has(x.id)) continue;
      if (dirty('days/' + x.id) && local.has(x.id)) { next.push(local.get(x.id)); continue; }
      const d = x.data();
      next.push({ id: x.id, order: +d.order || 0, label: String(d.label || '').slice(0, 40), places: Array.isArray(d.places) ? d.places.map(cleanPlace).filter(Boolean) : [] });
    }
    for (const [id, d] of local) if (dirty('days/' + id) && !deleted.has(id) && !next.find(n => n.id === id)) next.push(d);
    next.sort((a, b) => a.order - b.order || (a.id < b.id ? -1 : 1));
    state.days = next;
    render();
  }, onErr);
  db.doc('notes/buylist').onSnapshot(s => { if (!dirty('notes/buylist')) { state.buy = s.exists ? cleanItems(s.data().items) : []; render(); } }, onErr);
  db.doc('notes/checklist').onSnapshot(s => { if (!dirty('notes/checklist')) { state.check = s.exists ? cleanItems(s.data().items) : []; render(); } }, onErr);
  db.doc('notes/wishlist').onSnapshot(s => { if (!dirty('notes/wishlist')) { state.wish = s.exists ? cleanItems(s.data().items) : []; render(); } }, onErr);
}
async function boot() {
  render();
  const code = location.hash.replace(/^#/, '').trim();
  if (!FIREBASE_CONFIG || !window.firebase || code.length < 16) {
    localMode = true; loadLocal();
    if (FIREBASE_CONFIG && code.length < 16) { noCode = true; render(); }
    return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  const fs = firebase.firestore(), base = 'trips/' + code + '/';
  db = { doc: p => fs.doc(base + p), collection: p => fs.collection(base + p) };
  subscribe();
}
boot();
})();
